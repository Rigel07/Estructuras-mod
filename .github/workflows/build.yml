name: Extraer zip y compilar mod (.jar)

on:
  push:
  workflow_dispatch:
    inputs:
      reextraer:
        description: "Volver a extraer el zip (sobrescribe el codigo del repositorio)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Extraer el zip del mod
        id: extract
        env:
          REEXTRAER: ${{ inputs.reextraer }}
        run: |
          set -e
          if [ -f build.gradle ] && [ "$REEXTRAER" != "true" ]; then
            echo "El codigo ya esta en el repositorio: se compila directamente."
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP=$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No hay ningun .zip en la raiz del repositorio (ni un build.gradle). Sube el zip del mod."
            exit 1
          fi
          echo "Extrayendo $ZIP"
          rm -rf /tmp/mod
          mkdir /tmp/mod
          unzip -q -o "$ZIP" -d /tmp/mod
          GRADLE_FILE=$(find /tmp/mod -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::El zip no contiene un proyecto del mod (falta build.gradle)."
            exit 1
          fi
          SRC=$(dirname "$GRADLE_FILE")
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Guardar el codigo extraido en el repositorio
        if: steps.extract.outputs.extracted == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Codigo extraido automaticamente del zip"
            git push
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
